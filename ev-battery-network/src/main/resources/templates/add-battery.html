<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Battery</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-title">EV Battery Network</div>
    <ul class="nav-links">
        <li><a href="/">Dashboard</a></li>
        <li><a href="/batteries">Battery Packs</a></li>
        <li><a href="/fleets">Fleet Customers</a></li>
        <li><a href="/swaps/add">Battery Swap</a></li>
        <li><a href="/recycling">Recycling</a></li>
    </ul>
</nav>

<div class="container">
    <h1>Add Battery Pack</h1>

    <form class="form-box" th:action="@{/batteries/add}" th:object="${batteryPack}" method="post">

        <label>Battery Code</label>
        <input type="text" th:field="*{batteryCode}" placeholder="e.g. BAT004" required>

        <label>Capacity (kWh)</label>
        <input type="number" step="0.1" th:field="*{capacity}" placeholder="e.g. 50" required>

        <label>State of Health (%)</label>
        <input type="number" step="0.1" min="0" max="100" th:field="*{stateOfHealth}" placeholder="e.g. 90" required>

        <button type="submit" class="btn">Add Battery</button>
    </form>
</div>

</body>
</html>
